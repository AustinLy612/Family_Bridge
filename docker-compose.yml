# FamilyBridge local stack (Plan Phase 0 task 3; Plan §3.1).
# All ports bind to 127.0.0.1 only. Secrets come from .env (never committed).
name: familybridge

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: familybridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: familybridge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familybridge -d familybridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Least privilege (Plan §5.12): the API runs as a DML-only role; `migrate` (run at start-up)
      # connects as the owner and creates/updates that role from APP_DB_PASSWORD.
      DATABASE_URL: postgresql+psycopg://familybridge_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/familybridge
      MIGRATION_DATABASE_URL: postgresql+psycopg://familybridge:${POSTGRES_PASSWORD}@db:5432/familybridge
      APP_DB_USER: familybridge_app
      TEST_DATABASE_URL: postgresql+psycopg://familybridge:${POSTGRES_PASSWORD}@db:5432/test_familybridge
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
      # The embedding model (~2.2 GB) is cached on the host in the git-ignored knowledge/ dir,
      # so the image stays small and the model downloads at most once (D45).
      EMBEDDING_CACHE_DIR: /srv/knowledge/models
      KNOWLEDGE_WORK_DIR: /srv/knowledge
    volumes:
      - ./knowledge/models:/srv/knowledge/models
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
