# Risk keyword lists for the keyword channel of safety screening (Plan §5.7, Phase 2 task 2).
# DRAFT. Not clinically reviewed (O10). Seeded from DBT_Revised risk/services.py (D1):
# HIGH_RISK_KEYWORDS, MODERATE_RISK_KEYWORDS and _MODERATE_CONCERN_INDICATORS.
# Changes from the source, to stop ordinary speech from triggering (Plan §5.7):
#   - removed "死掉" (high): matches "植物死掉了"; "想死" still covers the self-directed form
#   - removed "我要杀" and "kill them" (moderate): match game talk ("我要杀了这个boss", "kill them at basketball")
#   - "nothing matters" became "nothing matters anymore" ("nothing matters more than family")
#   - "jump off" became specific places ("jump off a bridge" and similar)
#   - "no reason to live" moved from moderate to high
#   - added indirect disclosures (Plan §9.2), e.g. "better off without me", "遗书", "一了百了"
#   - Phase 4 (D52): concern indicators for indirect warning signs found by the adversarial
#     suite (giving belongings away, "easier without me") so the assess_risk LLM channel runs
#   - added `benign` phrases, which are removed before matching (e.g. "想死你了" = "miss you so much")
#
# How matching works (backend/app/safety/screening.py):
#   - text is NFKC-normalised and case-folded; curly apostrophes become straight ones
#   - zh-CN terms are matched with all whitespace removed ("想 死" matches "想死")
#   - en terms are matched as whole words or phrases ("hopeless" does not match "hopelessly")
#   - every list is checked for every user, whatever their language setting
#   - high -> severity high, stop the activity; moderate or concern -> severity medium
#     (with the LLM channel off, concern indicators count as medium, as in DBT_Revised)
