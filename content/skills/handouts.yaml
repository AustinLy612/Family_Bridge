# Handout index of the DBT-A manual (Plan §5.3 step 3, Appendix A). Committed mapping (D44).
# English titles are the developer's own short descriptions. Chinese titles and all manual text
# are read from the PDF at ingestion time and stored only in the database, never in this repo (D7).
# Page numbers are PDF pages. In-page headers are unreliable (e.g. Interpersonal Effectiveness
# pages 106 and 111-113 carry wrong numbers), so mapping is by title and page; ingestion
# cross-checks it against the page headers it can read.
# `diagram_pages` have no usable text layer and are read from manual transcriptions (D43).
kind: handout_index
version: 1
