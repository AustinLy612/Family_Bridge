# Skill taxonomy (Plan Appendix B; Phase 3 task 1). Stable internal ids.
# Names are short standard DBT terms (developer draft). handout_refs point at
# content/skills/handouts.yaml and must match its skill_ids (checked by the content loader).
# Do not add skills that are not in the manual. Clinical review pending (Plan §8 O10).
kind: skill_taxonomy
version: 2
approval:
  status: draft
  approved_by: null
  approved_at: null
modules:
  - id: orientation
    name:
      zh-CN: "导论"
      en: "Orientation"
    skills:
      - id: ori.what_is_dbt
        name:
          zh-CN: "什么是DBT"
          en: "What DBT is"
        handout_refs: [ori.h1, ori.h2, ori.h3, ori.h6, ori.h7]
      - id: ori.biosocial_theory
        name:
          zh-CN: "生物社会理论"
          en: "Biosocial theory"
        handout_refs: [ori.h4]
      - id: ori.assumptions
        name:
          zh-CN: "DBT假设"
          en: "DBT assumptions"
        handout_refs: [ori.h5]
  - id: mindfulness
    name:
      zh-CN: "正念"
      en: "Mindfulness"
    skills:
      - id: mf.states_of_mind
        name:
          zh-CN: "三种心念状态"
          en: "Three states of mind"
        handout_refs: [mf.h3, mf.h4]
      - id: mf.what_skills
        name:
          zh-CN: "正念“什么”技能"
          en: "Mindfulness WHAT skills"
        handout_refs: [mf.h1, mf.h2, mf.h5, mf.h7, mf.h8]
      - id: mf.how_skills
        name:
          zh-CN: "正念“如何”技能"
          en: "Mindfulness HOW skills"
        handout_refs: [mf.h1, mf.h2, mf.h6, mf.h7, mf.h8]
