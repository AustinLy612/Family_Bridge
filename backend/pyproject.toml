[project]
name = "familybridge-api"
version = "0.0.1"
description = "GenAI-DBT FamilyBridge API (Stage 1, demo data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6",
  "python-frontmatter>=1.1",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "fastembed>=0.7",
  "jieba>=0.42",
  "httpx>=0.27",  # DeepSeek client (D48)
]

[project.optional-dependencies]
# PyMuPDF is AGPL: only the local ingestion tool uses it, never the API image (D45).
kb-ingest = ["pymupdf>=1.25"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-PyYAML", "pip-audit>=2.7"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests
# Chinese UI text legitimately uses full-width punctuation and en dashes.
allowed-confusables = ["（", "）", "：", "，", "–", "；", "！", "？"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S105", "S106"]
"app/ai/mock.py" = ["E501"] # bilingual canned answers read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["frontmatter.*", "pgvector.*", "fastembed.*", "jieba.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
markers = ["db: needs the test PostgreSQL database"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
