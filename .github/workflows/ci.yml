# CI (Plan Phase 0 task 7): lint, type-check, tests, build, dependency audit, secret scan.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familybridge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: familybridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U familybridge" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://familybridge:ci-only-password@localhost:5432/familybridge
      TEST_DATABASE_URL: postgresql+psycopg://familybridge:ci-only-password@localhost:5432/test_familybridge
      LLM_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: ruff check app migrations
      - run: ruff format --check app migrations
      - run: mypy app
      - run: python -m app.cli check-content
      - run: pytest
      - run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scan_repo.py
